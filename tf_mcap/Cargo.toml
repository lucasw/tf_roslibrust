[package]
name = "tf_mcap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
chrono = "0.4.38"
clap.workspace = true
log.workspace = true
mcap = "0.17.0"
nalgebra.workspace = true
roslibrust.workspace = true
serde_rosmsg = "0.2.0"
simple-log = "2.1.1"
simple_logger = "5.0.0"

[dependencies.roslibrust_util]
# not using the same roslibrust_util avoids issues with mcap_tools also depending on roslibrust_util
# path = "../roslibrust_util"
git = "https://github.com/lucasw/tf_roslibrust"
version = "0.16"

[dependencies.tf_roslibrust]
# path = "../tf_roslibrust"
git = "https://github.com/lucasw/tf_roslibrust"
version = "0.16"

[dependencies.mcap_tools]
git = "https://github.com/lucasw/mcap_tools"
# branch = "tf_static"
version = "0.16"

[[bin]]
name = "tf_mcap_tree"
path = "src/bin/mcap_tree.rs"

[[bin]]
name = "tf_mcap_lookup"
path = "src/bin/lookup.rs"

[[bin]]
name = "tf_mcap_tf2tfs"
path = "src/bin/tf2tfs.rs"
